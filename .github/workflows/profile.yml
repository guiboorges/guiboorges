name: Update profile

on:
  schedule:
    - cron: "17 * * * *" # every hour (off the top of the hour, when Actions is busiest)
  workflow_dispatch:
  # Instant refresh: other repos can send `repo-updated` (needs a token secret there, see CLAUDE.md)
  repository_dispatch:
    types: [repo-updated]
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Render profile cards
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
