<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="56"/></filter>
    <filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="rgba(255,232,214,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridmask"><rect width="1200" height="280" fill="url(#fade)"/></mask>
    <linearGradient id="baseg" x1="0" y1="280" x2="280" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="scale(4.285714285714286 1)">
      <stop offset="0" stop-color="#FF8A3D"/><stop offset="0.5" stop-color="#E0600F"/><stop offset="1" stop-color="#A63D0C"/></linearGradient>
    <g id="wall"><rect width="1200" height="280" fill="url(#baseg)"/><g filter="url(#soft)"><circle r="360" fill="#FF8A3D" opacity="0.35">
      <animate attributeName="cx" values="180;360;120;180" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="84;182;154;84" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="312" fill="#FF7722" opacity="0.35">
      <animate attributeName="cx" values="540;720;480;540" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="210;98;56;210" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="264" fill="#FF9A50" opacity="0.35">
      <animate attributeName="cx" values="960;780;1020;960" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="70;154;196;70" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="216" fill="#D9560F" opacity="0.35">
      <animate attributeName="cx" values="1104;960;840;1104" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="238;56;140;238" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="168" fill="#FFB37A" opacity="0.35">
      <animate attributeName="cx" values="420;240;660;420" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="28;84;252;28" dur="28s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle></g><rect width="1200" height="280" fill="url(#grid)" mask="url(#gridmask)"/></g><clipPath id="frame"><rect width="1200" height="280" rx="28"/></clipPath></defs>
  <g clip-path="url(#frame)"><use href="#wall"/>
