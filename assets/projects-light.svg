<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridmask"><rect width="1200" height="140" fill="url(#fade)"/></mask>
    <linearGradient id="baseg" x1="0" y1="140" x2="140" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="scale(8.571428571428571 1)">
      <stop offset="0" stop-color="#FFE8D6"/><stop offset="0.5" stop-color="#FF7722"/><stop offset="1" stop-color="#B7410E"/></linearGradient>
    <g id="wall"><rect width="1200" height="140" fill="url(#baseg)"/><g filter="url(#soft)"><circle r="360" fill="#FFE8D6" opacity="0.3">
      <animate attributeName="cx" values="180;360;120;180" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="42;91;77;42" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="312" fill="#FF9A50" opacity="0.3">
      <animate attributeName="cx" values="540;720;480;540" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="105;49;28;105" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="264" fill="#FF7722" opacity="0.3">
      <animate attributeName="cx" values="960;780;1020;960" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="35;77;98;35" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="216" fill="#FFD1B0" opacity="0.3">
      <animate attributeName="cx" values="1104;960;840;1104" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="119;28;70;119" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="168" fill="#B7410E" opacity="0.3">
      <animate attributeName="cx" values="420;240;660;420" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="14;42;126;14" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle></g><rect width="1200" height="140" fill="url(#grid)" mask="url(#gridmask)"/></g><clipPath id="frame"><rect width="1200" height="140" rx="28"/></clipPath></defs>
  <g clip-path="url(#frame)"><use href="#wall"/>
  <defs>
    <clipPath id="p0c"><rect x="56" y="24" width="1088" height="92" rx="34"/></clipPath>
    <linearGradient id="p0s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p0r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <filter id="p0d" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="56" y="24" width="1088" height="92" rx="34" fill="#000" filter="url(#p0d)" opacity=".5"/>
  <g clip-path="url(#p0c)">
    <g transform="translate(600 70) scale(1.12) translate(-600 -70)"><use href="#wall" filter="url(#refract)"/></g>
    <rect x="56" y="24" width="1088" height="92" fill="rgba(120,36,4,0.26)"/>
    <rect x="56" y="24" width="1088" height="92" fill="url(#p0s)"/>
  </g>
  <rect x="56.75" y="24.75" width="1086.5" height="90.5" rx="34" fill="none" stroke="url(#p0r)" stroke-width="1.5"/>
    <text x="96" y="82" font-size="36" font-weight="700" letter-spacing="-1" fill="#ffffff">Projects <tspan fill="rgba(255,255,255,0.9)" font-weight="600">· Projetos</tspan></text>
    
  <defs>
    <clipPath id="p1c"><rect x="917.2" y="52.4" width="186.8" height="35.2" rx="17.6"/></clipPath>
    <linearGradient id="p1s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
