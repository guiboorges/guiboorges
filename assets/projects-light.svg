    <g transform="translate(1010.6 70) scale(1.3) translate(-1010.6 -70)"><use href="#wall" filter="url(#refract)"/></g>
    <rect x="917.2" y="52.4" width="186.8" height="35.2" fill="rgba(120,36,4,0.26)"/>
    <rect x="917.2" y="52.4" width="186.8" height="35.2" fill="url(#p1s)"/>
  </g>
  <rect x="917.95" y="53.15" width="185.3" height="33.7" rx="17.6" fill="none" stroke="url(#p1r)" stroke-width="1.5"/>
    
    <text x="931.6" y="75.76" font-size="16" font-weight="600" textLength="158" lengthAdjust="spacingAndGlyphs" fill="#ffffff">All repositories ↗</text></g>
</svg>
