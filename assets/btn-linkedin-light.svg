<svg xmlns="http://www.w3.org/2000/svg" width="216" height="82" viewBox="0 0 216 82" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="refract" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gridmask"><rect width="216" height="82" fill="url(#fade)"/></mask>
    <linearGradient id="baseg" x1="0" y1="82" x2="82" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="scale(2.6341463414634148 1)">
      <stop offset="0" stop-color="#FFE8D6"/><stop offset="0.5" stop-color="#FF7722"/><stop offset="1" stop-color="#B7410E"/></linearGradient>
    <g id="wall"><rect width="216" height="82" fill="url(#baseg)"/><g filter="url(#soft)"><circle r="65" fill="#FFE8D6" opacity="0.3">
      <animate attributeName="cx" values="32;65;22;32" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="25;53;45;25" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="56" fill="#FF9A50" opacity="0.3">
      <animate attributeName="cx" values="97;130;86;97" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="62;29;16;62" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="48" fill="#FF7722" opacity="0.3">
      <animate attributeName="cx" values="173;140;184;173" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="21;45;57;21" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="39" fill="#FFD1B0" opacity="0.3">
      <animate attributeName="cx" values="199;173;151;199" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="70;16;41;70" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle><circle r="30" fill="#B7410E" opacity="0.3">
      <animate attributeName="cx" values="76;43;119;76" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="cy" values="8;25;74;8" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    </circle></g><rect width="216" height="82" fill="url(#grid)" mask="url(#gridmask)"/></g></defs>
  
  <defs>
    <clipPath id="p0c"><rect x="8" y="6" width="200" height="60" rx="30"/></clipPath>
    <linearGradient id="p0s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="p0r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <filter id="p0d" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="8" y="6" width="200" height="60" rx="30" fill="#000" filter="url(#p0d)" opacity=".5"/>
  <g clip-path="url(#p0c)">
    <g transform="translate(108 36) scale(1.25) translate(-108 -36)"><use href="#wall" filter="url(#refract)"/></g>
    <rect x="8" y="6" width="200" height="60" fill="rgba(120,36,4,0.26)"/>
    <rect x="8" y="6" width="200" height="60" fill="url(#p0s)"/>
  </g>
  <rect x="8.75" y="6.75" width="198.5" height="58.5" rx="30" fill="none" stroke="url(#p0r)" stroke-width="1.5"/>
  <rect x="46.5" y="23" width="26" height="26" rx="5.72" fill="#fff"/>
    <text x="59.5" y="43.28" text-anchor="middle" font-size="19.24" font-weight="800" letter-spacing="-0.5" fill="#B7410E">in</text>
  <text x="84.5" y="43" font-size="19" font-weight="600" textLength="85" lengthAdjust="spacingAndGlyphs" fill="#ffffff">LinkedIn</text>
</svg>
